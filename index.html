<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7f2">
  <meta property="og:title" content="3問で分かる｜あなたの声の心色診断">
  <meta property="og:description" content="30秒で、今のあなたの声ににじむ心の色を診断します。">
  <title>あなたの声の心色診断</title>
  <style>
    :root{--ink:#543f48;--rose:#c9677d;--line:#06c755}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;background:linear-gradient(145deg,#fffaf7,#f6ebe6)}
    main{max-width:700px;margin:auto;padding:22px 17px 50px}
    .card{padding:clamp(25px,6vw,46px);background:#ffffffdf;border:1px solid #ebd9d1;border-radius:28px;box-shadow:0 20px 60px #815a5218}
    .hidden{display:none!important}.badge{display:inline-block;padding:7px 14px;border-radius:99px;background:#f7e3e7;color:#a34e64;font:13px sans-serif;letter-spacing:.08em}
    h1{margin:18px 0 10px;font-size:clamp(30px,7vw,46px);line-height:1.35}.lead,.desc{line-height:1.9}
    .orbs{height:112px;position:relative;margin:15px 0}.orb{position:absolute;border-radius:50%;opacity:.62}.a{width:105px;height:105px;left:17%;background:#f0a0ad}.b{width:86px;height:86px;left:43%;top:20px;background:#8ed0d1}.c{width:96px;height:96px;right:16%;top:3px;background:#edc662}
    button,a{font:inherit}.btn,.choice{width:100%;border:0;border-radius:16px;padding:16px;cursor:pointer}.btn{background:linear-gradient(90deg,#b95d75,#dc8395);color:#fff;font-weight:bold;box-shadow:0 8px 20px #b9607938}.btn:hover,.choice:hover{transform:translateY(-2px)}
    .progress{height:7px;margin-bottom:27px;background:#eee4df;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#da8194,#e1b04b);transition:.3s}.qno{font:13px sans-serif;color:#aa6375}.question{margin:8px 0 22px;font-size:23px;line-height:1.65}.choices{display:grid;gap:12px}.choice{text-align:left;color:var(--ink);background:#fff;border:1px solid #ead9d2;transition:.2s}.choice:before{content:"◇";margin-right:10px;color:#cb7286}
    .center{text-align:center}.result-name{margin:7px 0;font-size:clamp(34px,8vw,48px)}.copy{font-size:21px;line-height:1.7;color:#a35167}.desc{padding:18px;text-align:left;background:#fff8f5;border-radius:18px}
    canvas{display:block;width:100%;height:auto;margin:22px auto;border-radius:20px;box-shadow:0 10px 30px #76504d20}.actions{display:grid;gap:10px}.sub{background:#fff;color:#9c5064;border:1px solid #d7a7aa;box-shadow:none}.line{display:block;padding:16px;text-align:center;text-decoration:none;color:#fff;background:var(--line);border-radius:16px;font-weight:bold}.note,.footer{font:12px/1.7 sans-serif;color:#8d777b;text-align:center}.footer{margin-top:20px}
  </style>
</head>
<body><main>
  <section id="startScreen" class="card">
    <span class="badge">VOICE × HEART COLOR</span>
    <h1>3問で分かる<br>あなたの声の心色診断</h1>
    <p class="lead">直感で選ぶ3つの答えから、今のあなたの声ににじむ「心の色」を読み解きます。所要時間は約30秒です。</p>
    <div class="orbs"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div>
    <button class="btn" id="startBtn">診断をはじめる</button>
  </section>

  <section id="quizScreen" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="qno" class="qno"></div><h2 id="question" class="question"></h2><div id="choices" class="choices"></div>
  </section>

  <section id="resultScreen" class="card hidden">
    <div class="center"><div>あなたの声の心色は</div><h2 id="resultName" class="result-name"></h2><div id="resultCopy" class="copy"></div><p id="resultDesc" class="desc"></p></div>
    <canvas id="resultCanvas" width="1080" height="1350"></canvas>
    <div class="actions">
      <button class="btn" id="shareBtn">診断結果を画像でシェア</button>
      <button class="btn sub" id="saveBtn">結果画像を保存</button>
      <a class="line" href="https://lin.ee/q5IELSl" target="_blank" rel="noopener">もっと詳しく知る｜公式LINEへ</a>
      <button class="btn sub" id="retryBtn">もう一度診断する</button>
    </div>
    <p class="note">共有先が画像に対応していない場合は、画像を保存してから投稿してください。</p>
  </section>
  <p class="footer">心の声の専門家　中川真樹子</p>
</main>
<script>
const questions=[
 {q:"誰かに大切なことを伝えるとき、あなたに近いのは？",a:[["気持ちが先にあふれる","coral"],["言葉を静かに選ぶ","aqua"],["相手を思いながら整える","gold"]]},
 {q:"今、あなたの声がいちばん求めているものは？",a:[["自信をもって一歩踏み出す","coral"],["本音を安心して話す","aqua"],["自分らしさを形にする","gold"]]},
 {q:"褒められるとしたら、どんな声がうれしい？",a:[["情熱が伝わる声","coral"],["心が落ち着く声","aqua"],["希望が湧く声","gold"]]}
];
const results={
 coral:{name:"コーラル・ハート",copy:"想いを動かす、あたたかな声",desc:"あなたの声には、人の心に火を灯す情熱と親しみがあります。気持ちを急いで届けようとせず、ひと呼吸おいて言葉にすると、あなた本来の魅力がさらに伝わります。",c1:"#ef9aa6",c2:"#d86178"},
 aqua:{name:"アクア・ハート",copy:"本音を包む、澄んだ声",desc:"あなたの声には、相手を安心させる静けさと共感力があります。周りに合わせるだけでなく、小さな本音も声に乗せることで、あなたの存在感はより鮮やかになります。",c1:"#9edddd",c2:"#489fa8"},
 gold:{name:"ゴールド・ハート",copy:"未来を照らす、しなやかな声",desc:"あなたの声には、可能性を見つけて道を照らす力があります。正しさよりも、今感じていることを素直に響かせると、言葉と行動が自然につながっていきます。",c1:"#f1d27b",c2:"#c59a37"}
};
let step=0,scores={coral:0,aqua:0,gold:0},current="coral";
const $=id=>document.getElementById(id);
function begin(){$("startScreen").classList.add("hidden");$("quizScreen").classList.remove("hidden");render()}
function render(){const x=questions[step];$("qno").textContent="QUESTION "+(step+1)+" / 3";$("question").textContent=x.q;$("bar").style.width=((step+1)/3*100)+"%";$("choices").innerHTML="";x.a.forEach(([label,key])=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>answer(key);$("choices").appendChild(b)})}
function answer(key){scores[key]++;if(++step<3)render();else show()}
function show(){current=["coral","aqua","gold"].reduce((a,b)=>scores[b]>scores[a]?b:a);const r=results[current];$("quizScreen").classList.add("hidden");$("resultScreen").classList.remove("hidden");$("resultName").textContent=r.name;$("resultName").style.color=r.c2;$("resultCopy").textContent="「"+r.copy+"」";$("resultDesc").textContent=r.desc;draw(r);scrollTo({top:0,behavior:"smooth"})}
function wrap(ctx,text,x,y,max,line){let s="",out=[];for(const ch of [...text]){if(ctx.measureText(s+ch).width>max){out.push(s);s=ch}else s+=ch}if(s)out.push(s);out.forEach((v,i)=>ctx.fillText(v,x,y+i*line));return out.length}
function draw(r){const c=$("resultCanvas"),ctx=c.getContext("2d"),g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#fffaf7");g.addColorStop(1,"#f6ebe6");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.globalAlpha=.35;ctx.fillStyle=r.c1;ctx.beginPath();ctx.arc(150,160,235,0,7);ctx.fill();ctx.fillStyle=r.c2;ctx.beginPath();ctx.arc(940,1180,300,0,7);ctx.fill();ctx.globalAlpha=1;ctx.textAlign="center";ctx.fillStyle="#97646f";ctx.font="32px serif";ctx.fillText("3問で分かる｜あなたの声の心色診断",540,145);ctx.fillStyle="#654c53";ctx.font="34px serif";ctx.fillText("あなたの声の心色は",540,300);ctx.fillStyle=r.c2;ctx.font="bold 75px serif";ctx.fillText(r.name,540,420);ctx.font="bold 43px serif";wrap(ctx,"「"+r.copy+"」",540,525,800,62);ctx.fillStyle="#ffffffdc";ctx.beginPath();ctx.roundRect(105,650,870,405,36);ctx.fill();ctx.fillStyle="#654c53";ctx.font="32px serif";wrap(ctx,r.desc,540,735,730,54);ctx.fillStyle="#89666d";ctx.font="30px serif";ctx.fillText("心の声の専門家　中川真樹子",540,1185);ctx.font="24px sans-serif";ctx.fillText("詳しい声解析は公式LINEへ",540,1240)}
function imageBlob(){return new Promise(ok=>$("resultCanvas").toBlob(ok,"image/png"))}
async function share(){const b=await imageBlob(),f=new File([b],"kokoroiro-result.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"あなたの声の心色診断",text:"私の診断結果です"})}catch(e){}}else save()}
function save(){const a=document.createElement("a");a.download="kokoroiro-result.png";a.href=$("resultCanvas").toDataURL("image/png");a.click()}
function retry(){step=0;scores={coral:0,aqua:0,gold:0};$("resultScreen").classList.add("hidden");$("startScreen").classList.remove("hidden");scrollTo({top:0,behavior:"smooth"})}
$("startBtn").onclick=begin;$("shareBtn").onclick=share;$("saveBtn").onclick=save;$("retryBtn").onclick=retry;
</script></body></html>
