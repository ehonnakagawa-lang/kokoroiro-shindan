<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f5"><title>3問で分かる・あなたの声の心色診断</title>
<style>
:root{--ink:#26333b;--tone:#d85f83}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f1eb}button,a{font:inherit}.hidden{display:none!important}.page{min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 10%,#fff 0 12%,transparent 35%),linear-gradient(145deg,#fff9f5,#f4f8f5)}.card{width:min(100%,580px);padding:44px 36px 32px;background:#ffffffe8;border:1px solid #fff;border-radius:30px;box-shadow:0 24px 70px #48362a1f;text-align:center}.eyebrow{margin:0 0 18px;color:#8b7770;font:700 11px Arial;letter-spacing:.17em}.hero h1{margin:0;font:clamp(36px,10vw,58px)/1.25 "Yu Mincho",serif}.hero h1 small{display:block;margin-bottom:6px;color:#7c6b64;font:500 18px sans-serif;letter-spacing:.16em}.hero h1 em{color:#d85f83;font-style:normal;font-size:1.22em}.lead{margin:24px 0 16px;color:#5e696f;font-size:15px;line-height:2}.dots{display:grid;grid-template-columns:repeat(6,10px);justify-content:center;gap:8px;margin:18px 0 28px}.dots i{width:10px;height:10px;border-radius:50%}.start,.primary{width:100%;padding:17px 22px;border:0;border-radius:99px;color:#fff;background:linear-gradient(110deg,#cf557d,#9b6aa5);box-shadow:0 12px 28px #b9527e40;font-weight:700;cursor:pointer}.privacy,.note{color:#908883;font-size:11px;line-height:1.7}.privacy{margin:14px 0 24px}footer{padding-top:20px;border-top:1px solid #ede5df;color:#74645e;font:600 12px "Yu Mincho",serif}.quiz{text-align:left}.head{display:flex;justify-content:space-between;color:#8a7670;font:700 11px Arial}.track{height:5px;margin:13px 0 36px;border-radius:99px;background:#eee8e4;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#d85f83,#856cad)}.quiz h2{margin:0;font:clamp(24px,6vw,32px)/1.55 "Yu Mincho",serif}.guide{color:#8c8581;font-size:12px}.options{display:grid;gap:11px;margin-top:24px}.options button{display:grid;grid-template-columns:32px 1fr 18px;align-items:center;gap:10px;width:100%;padding:15px;border:1px solid #e9dfda;border-radius:16px;color:var(--ink);background:#fff;text-align:left;cursor:pointer}.options button span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#a04f70;background:#f8e9ef;font:700 12px Arial}.options button b{color:#bbaca6;font-size:22px}.back,.again{margin:22px auto 0;border:0;color:#8c7d77;background:transparent;font-size:12px;cursor:pointer}.result{--tone:#d85f83}.orb{display:grid;place-items:center;width:112px;height:112px;margin:4px auto 18px;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 30%,#ffffff99,var(--tone) 38%,#3d3547);box-shadow:0 14px 38px color-mix(in srgb,var(--tone) 35%,transparent);font:20px "Yu Mincho",serif}.label{margin:0;color:#897b74;font-size:13px}.result h1{margin:7px 0;color:var(--tone);font:clamp(30px,8vw,43px) "Yu Mincho",serif}.prob{margin:0 0 14px;color:#897b74;font-size:13px}.prob strong{color:var(--tone);font-size:22px}.catch{font:600 17px/1.8 "Yu Mincho",serif}.desc{color:#58666c;font-size:14px;line-height:1.85}.ranking{display:grid;gap:9px;margin:18px 0;padding:15px;border-radius:16px;background:#fff;text-align:left}.rankrow{display:grid;grid-template-columns:18px 13px 1fr auto;align-items:center;gap:8px;font-size:12px}.rankrow>i{width:12px;height:12px;border-radius:50%}.rankrow em{grid-column:3/5;height:4px;border-radius:99px;background:#eee8e4;overflow:hidden}.rankrow em i{display:block;height:100%;border-radius:99px}.details{display:grid;gap:10px;margin:18px 0;text-align:left}.details div{padding:14px 16px;border-radius:15px;background:color-mix(in srgb,var(--tone) 7%,white)}.details span{display:block;color:var(--tone);font-size:11px;font-weight:700}.details strong{font-size:13px;line-height:1.7}.actions{display:grid;gap:10px}.secondary{padding:15px;border:1px solid var(--tone);border-radius:99px;color:var(--tone);background:#fff;font-weight:700;text-decoration:none}.result footer{margin-top:20px}@media(max-width:480px){.page{padding:11px}.card{padding:32px 21px 25px;border-radius:24px}}
</style></head><body>
<main id="start" class="page"><section class="card hero"><p class="eyebrow">VOICE × 12 HEART COLORS</p><h1><small>3問で分かる</small>あなたの声の<br><em>心色</em>診断</h1><p class="lead">声には、まだ言葉になっていない<br>あなたの魅力が宿っています。</p><div id="dots" class="dots"></div><button class="start" id="startBtn">診断をはじめる　約1分</button><p class="privacy">12色の確率で表示｜登録不要・無料｜回答は保存しません</p><footer>中川真樹子｜心の声の専門家</footer></section></main>
<main id="quiz" class="page hidden"><section class="card quiz"><div class="head"><span id="qnum"></span><span id="count"></span></div><div class="track"><i id="bar"></i></div><h2 id="qtitle"></h2><p class="guide">考えすぎず、今の自分に近いものを選んでください。</p><div id="options" class="options"></div><button id="back" class="back">← 前の質問へ</button></section></main>
<main id="result" class="page result hidden"><section class="card"><p class="eyebrow">12 COLORS × VOICE</p><div class="orb">心色</div><p class="label">あなたの声の心色は</p><h1 id="rname"></h1><p class="prob">心色の確率 <strong id="rpercent"></strong></p><p id="rcatch" class="catch"></p><p id="rdesc" class="desc"></p><div id="ranking" class="ranking"></div><div class="details"><div><span>声に宿る力</span><strong id="rstrength"></strong></div><div><span>今日の声の整え方</span><strong id="rcare"></strong></div></div><p class="note">この診断は回答傾向を12色へ確率換算した自己理解のための簡易チェックです。実際の声を測定する「声解析」とは異なります。</p><div class="actions"><button class="primary" id="share">結果カード画像をシェアする</button><a class="secondary" href="https://lin.ee/q5IELSl">あなたの声を、もっと深く知りたい方へ</a><button class="again" id="again">もう一度診断する</button></div><footer>中川真樹子｜心の声の専門家</footer></section></main>
<script>
(()=>{
const colors=[
["情熱を動かすレッド","レッド","あなたの声は、迷いを越えて一歩を生む力。","まっすぐな意志と行動力が声に宿っています。大切な場面で決断を促し、周囲に勇気を与えられる人です。","決断力・情熱・突破力","力を込める前に息をゆっくり吐くと、強さの中に安心感が生まれます。","#cf3f46"],
["ぬくもりを届けるコーラル","コーラル","あなたの声は、心と心の距離を近づける温度。","親しみやすさと素直な感情が声に表れます。自然体の言葉で、相手の緊張をほどく力があります。","親近感・素直さ・つながる力","相手を元気づける前に、自分の気持ちにもやさしい言葉を向けてみましょう。","#ec766f"],
["喜びを広げるオレンジ","オレンジ","あなたの声は、場に笑顔と動きを生むリズム。","明るさと社交性が声に乗り、人を自然に巻き込みます。楽しさを分かち合うほど魅力が輝きます。","社交性・表現力・活性化する力","話す速さを少し緩めると、明るさに深みと説得力が加わります。","#e88935"],
["未来を照らすゴールド","ゴールド","あなたの声は、未来へ進む光。","可能性を見つけ、価値を形にする力が声に宿っています。周りの人の一歩を自然に後押しできます。","実現力・希望・人を励ます力","成果だけでなく、今ここまで来た自分の歩みにも声で丸をつけましょう。","#c99726"],
["ひらめきを運ぶイエロー","イエロー","あなたの声は、新しい見方を届ける風。","好奇心と軽やかな発想が声に表れます。難しいことも分かりやすく、楽しく伝えられる人です。","発想力・言語化・学びを広げる力","頭で整えすぎず、最初に浮かんだ一言を声にすると魅力が伝わります。","#d9b72e"],
["可能性を育てるライム","ライム","あなたの声は、まだ見ぬ芽を見つける光。","変化を楽しみ、人の成長や新しい可能性を見つける声の持ち主です。柔軟な言葉が未来を開きます。","成長力・柔軟性・可能性を見る力","次へ進む前に、今日できた小さな変化を一つ声に出して認めましょう。","#91b83d"],
["調和を育てるグリーン","グリーン","あなたの声は、人と人の間に安心を育てる森。","穏やかさとバランス感覚が声に宿っています。違う意見をつなぎ、安心して話せる場を作れます。","調整力・安心感・関係を育てる力","調和を優先する前に「私はこう思う」を短く添えてみましょう。","#4d9a67"],
["信頼をつなぐアクア","アクア","あなたの声は、揺れる心を整える水面。","物事を丁寧に受け止め、分かりやすく伝えられる声の持ち主です。落ち着いた響きが信頼を育てます。","誠実さ・整理力・安心感","正しく話そうとしすぎず、短い言葉でも今の気持ちを添えてみましょう。","#258b98"],
["真実を伝えるブルー","ブルー","あなたの声は、誠実な言葉を遠くまで運ぶ空。","冷静さと責任感が声に表れます。必要な情報をぶれずに伝え、周囲に確かな信頼を与えます。","冷静さ・責任感・伝達力","事実のあとに感じたことを一言加えると、声にあなたらしい温度が生まれます。","#3d6ea8"],
["静かな確信のインディゴ","インディゴ","あなたの声は、静けさの中から答えを見つける夜空。","深い集中力と内省が声に宿っています。少ない言葉でも、核心を落ち着いて伝えられる人です。","集中力・探究心・見極める力","考えがまとまるまで待ちすぎず、途中の思いも少しずつ声に出してみましょう。","#46558f"],
["本質をひらくバイオレット","バイオレット","あなたの声は、まだ見ぬあなたへの入り口。","表面だけでなく、言葉の奥にある本質を感じる声の持ち主です。静かな一言が深い気づきを生みます。","洞察力・感性・心を動かす力","完璧な言葉を探すより、最初に浮かんだ一言を声に出してみましょう。","#8063a6"],
["想いを響かせるマゼンタ","マゼンタ","あなたの声は、愛と使命をひとつにする響き。","深い共感と強い信念が声に重なります。大切にしている世界観を語るほど、人の心を動かします。","包容力・使命感・変容を促す力","すべてを背負わず、今いちばん届けたい一つの想いに声を集中させましょう。","#b64f91"]
].map(x=>({name:x[0],short:x[1],catch:x[2],desc:x[3],strength:x[4],care:x[5],color:x[6]}));
const questions=[
["人と話すとき、いちばん近いのは？",[["相手の気持ちを感じ取りながら話す",0],["思いついたことを素直に言葉にする",3],["考えを整理して、落ち着いて伝える",6],["言葉の奥にある意味を大切にする",9]]],
["声を出すとき、よく感じることは？",[["相手に合わせすぎて、本音を飲み込む",1],["気持ちが乗ると、声が明るく弾む",5],["緊張しても、きちんと伝えようとする",8],["伝えたいのに、言葉を選びすぎる",11]]],
["これから、どんな声でありたい？",[["迷いを越え、一歩を生み出す声",2],["可能性を見つけ、希望を届ける声",4],["人と人をつなぎ、調和を育てる声",7],["本質に触れ、深い気づきを生む声",10]]]
];
let step=0,signals=[],ranking=[],top=null;const $=id=>document.getElementById(id);
colors.forEach(c=>{const i=document.createElement("i");i.style.background=c.color;$("dots").appendChild(i)});
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));scrollTo({top:0,behavior:"smooth"})}
function render(){const q=questions[step];$("qnum").textContent="QUESTION "+(step+1);$("count").textContent=(step+1)+" / 3";$("bar").style.width=(step+1)/3*100+"%";$("qtitle").textContent=q[0];$("options").innerHTML="";q[1].forEach((o,i)=>{const b=document.createElement("button");b.innerHTML="<span>"+String.fromCharCode(65+i)+"</span>"+o[0]+"<b>›</b>";b.onclick=()=>choose(o[1]);$("options").appendChild(b)});$("back").disabled=!step}
function calculate(){const raw=Array(12).fill(1);signals.forEach(s=>raw.forEach((_,i)=>{let d=Math.abs(i-s);d=Math.min(d,12-d);raw[i]+=[8,5,2,1,0,0,0][d]}));const target=(signals[0]+2*signals[1]+3*signals[2])%12;raw.forEach((_,i)=>{let d=Math.abs(i-target);d=Math.min(d,12-d);raw[i]+=[10,6,3,1,0,0,0][d]});const ex=raw.map(v=>Math.exp(v/3.8)),sum=ex.reduce((a,b)=>a+b,0);return ex.map((v,i)=>({index:i,percent:Math.round(v/sum*1000)/10})).sort((a,b)=>b.percent-a.percent)}
function choose(s){signals.push(s);if(step<2){step++;render()}else result()}
function result(){ranking=calculate();top=ranking[0];const r=colors[top.index];$("result").style.setProperty("--tone",r.color);$("rname").textContent=r.name;$("rpercent").textContent=top.percent+"%";$("rcatch").textContent="「"+r.catch+"」";$("rdesc").textContent=r.desc;$("rstrength").textContent=r.strength;$("rcare").textContent=r.care;$("ranking").innerHTML="";ranking.slice(0,3).forEach((v,i)=>{const c=colors[v.index],d=document.createElement("div");d.className="rankrow";d.innerHTML="<span>"+(i+1)+"</span><i style='background:"+c.color+"'></i><b>"+c.short+"</b><span>"+v.percent+"%</span><em><i style='width:"+(v.percent/top.percent*100)+"%;background:"+c.color+"'></i></em>";$("ranking").appendChild(d)});$("share").textContent="結果カード画像をシェアする";show("result")}
function reset(){step=0;signals=[];ranking=[];show("start")}
function wrap(ctx,text,x,y,max,line){let s="",row=0;for(const ch of text){const t=s+ch;if(ctx.measureText(t).width>max&&s){ctx.fillText(s,x,y+row*line);s=ch;row++}else s=t}ctx.fillText(s,x,y+row*line)}
async function share(){const r=colors[top.index],c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=1080;c.height=1350;const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#fffaf6");g.addColorStop(1,"#f4f8f5");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.textAlign="center";ctx.fillStyle="#85736c";ctx.font="700 25px sans-serif";ctx.fillText("3問で分かる・あなたの声の心色診断",540,100);const o=ctx.createRadialGradient(500,240,20,540,290,140);o.addColorStop(0,"#fff");o.addColorStop(.35,r.color);o.addColorStop(1,"#3d3547");ctx.fillStyle=o;ctx.beginPath();ctx.arc(540,295,135,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="38px serif";ctx.fillText("心 色",540,310);ctx.fillStyle="#897b74";ctx.font="28px sans-serif";ctx.fillText("あなたの声の心色は",540,495);ctx.fillStyle=r.color;ctx.font="700 58px serif";ctx.fillText(r.name,540,580);ctx.fillStyle="#26333b";ctx.font="600 33px serif";wrap(ctx,"「"+r.catch+"」",540,655,880,50);ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(90,770,900,350,34);ctx.fill();ctx.textAlign="left";ctx.fillStyle=r.color;ctx.font="700 24px sans-serif";ctx.fillText("心色の確率 "+top.percent+"%",140,830);ranking.slice(0,3).forEach((v,i)=>{const y=890+i*67,a=colors[v.index];ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(155,y-7,12,0,7);ctx.fill();ctx.fillStyle="#38464b";ctx.font="600 25px sans-serif";ctx.fillText(a.short,185,y);ctx.textAlign="right";ctx.fillText(v.percent+"%",930,y);ctx.textAlign="left"});ctx.textAlign="center";ctx.fillStyle="#74645e";ctx.font="600 25px serif";ctx.fillText("中川真樹子｜心の声の専門家",540,1210);const blob=await new Promise(ok=>c.toBlob(ok,"image/png")),file=new File([blob],"声の心色診断_"+r.short+".png",{type:"image/png"});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:"あなたの声の心色診断",text:"私の診断結果です"});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}$("share").textContent="結果画像を共有しました"}catch{}}
$("startBtn").onclick=()=>{step=0;signals=[];render();show("quiz")};$("back").onclick=()=>{if(step){step--;signals.pop();render()}};$("again").onclick=reset;$("share").onclick=share;
})();
</script></body></html>
